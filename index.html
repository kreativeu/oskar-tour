/* Layout: full-bleed photo studio; quiet label card top-left, camera + light controls in a glass strip along the bottom */

  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {

    --cove: #2a2926; --ink: #f1efe9; --ink-soft: #a9a59c;
    --panel: rgba(30, 29, 27, 0.78); --line: rgba(241, 239, 233, 0.14);
    --accent: #d77447; --on-accent: #1a1918; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cove: #2a2926; --ink: #f1efe9; --ink-soft: #a9a59c;
  --panel: rgba(30, 29, 27, 0.78); --line: rgba(241, 239, 233, 0.14);
  --accent: #d77447; --on-accent: #1a1918; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--cove); color: var(--ink);

}
#stage { position: fixed; inset: 0; }

.label {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);

  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;

}
.controls {
  pointer-events: auto;

  border: 1px solid var(--line); border-radius: 12px; padding: 8px;

}
.group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sep { width: 1px; align-self: stretch; background: var(--line); }
.cap { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); padding: 0 4px 0 6px; }

}
button:hover { border-color: var(--line); }

.slider { display: flex; align-items: center; gap: 8px; padding: 0 6px; }

input[type="range"] { width: 110px; accent-color: var(--accent); }

.loader {

.tour {

.tour-nav button.primary { background: var(--ink); color: var(--cove); border-color: transparent; }

@media (max-width: 640px) { .label { display: none; } .tour p { min-height: 0; } }
@media (prefers-reduced-motion: reduce) { .loader .fill, .fade { transition: none; } }

const MODEL_URL = 'oskar-16426d45f4.wasm';   // gzip-packed GLB; the extension is only for hosting
// the model file is in the website's coordinates; room lights below were measured in the SketchUp export's
const SITE_OFFSET = new THREE.Vector3(-21.99, 0.51, 23.68);

// Guided tour, taken from the website's Oskar Concept project file (model coordinates, metres)
const TOUR = [
  { title: 'Overview', text: 'A detached two-storey family house on a flat 982 m² plot in Ulcinj, Montenegro. A white cube with a double-height living space, flanked by two lower annexes in white facade brick.',
    pos: [-38, 24, 42], target: [0, 2, 0] },
  { title: 'Garden facade', text: 'Large glass walls open the living area to the south-west: a 119 m² timber-decked terrace and a 402 m² garden.',
    pos: [-26, 4, -2], target: [0, 3, 0] },
  { title: 'Arrival', text: 'Pedestrian and car access from the south-east. Two parking spaces on the plot and a 35 m² garage for two more cars in the brick annex.',
    pos: [-16, 5, 24], target: [0, 2.2, 13] },
  { title: 'Living, dining & kitchen', interior: true, text: 'One 71 m² open space for living, dining and cooking around a central kitchen island, with oak parquet floors, granite-tiled kitchen walls and full-height glazing towards the terrace.',
    pos: [-2.6, 2.1, -5.2], target: [-0.8, 1.7, 5], fov: 60 },
  { title: 'Upper floor', interior: true, text: 'The inner stair rises to a gallery over the double-height living space and the family’s additional bedrooms. The rest of the floor is a self-contained two-bedroom apartment with its own entrance.',
    pos: [0.5, 5.2, -5.6], target: [-3.6, 4.0, 0.0], fov: 62 },
  { title: 'Wellness annex', text: 'The recreation block: a sauna, showers and a 22 m² rest area, linked to the house by terraces.',
    pos: [-14, 4, -36], target: [0, 2.5, -15] },
  { title: 'From above', text: 'A flat roof over 599 m² of gross floor area: 402 m² on the ground floor and 197 m² on the first floor.',
    pos: [0, 75, 0.01], target: [0, 0, 0] },
];
const DEFAULT_FOV = 40;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
// PCF honours shadow.radius, so each frame already has a soft, blurred shadow edge
renderer.shadowMap.type = THREE.PCFShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// soft studio reflections: metal finishes (silver, iron, chrome, seamed metal) render black without something to reflect
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.08;
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
// wide limits: tour stops include a straight-down view and eye-level interiors
controls.maxPolarAngle = Math.PI * 0.95;
controls.minPolarAngle = 0;

/* backdrop colour follows the page theme */
function coveColor() {
  return new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--cove').trim() || '#ecebe7');
}
const isDark = () => coveColor().getHSL({}).l < 0.4;

/* ---------- studio rig: cove + three area lights, turns with the camera ---------- */
const studio = new THREE.Group();
scene.add(studio);
const coveMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0, side: THREE.DoubleSide });

function buildCove(R) {
  // profile in (z, y): floor in front -> floor behind -> quarter-circle sweep -> tall back wall
  const front = 7 * R, back = 1.8 * R, r = 1.6 * R, H = 6 * R, W = 14 * R;
  const prof = [];
  const steps = 40;
  prof.push([front, 0]);
  for (let i = 0; i <= 10; i++) prof.push([front - (front + back) * i / 10, 0]);
  for (let i = 1; i <= steps; i++) {
    const t = (i / steps) * Math.PI / 2;
    prof.push([-back - r * Math.sin(t), r - r * Math.cos(t)]);
  }
  prof.push([-back - r, H]);
  const xs = 40;
  const pos = [], idx = [];
  for (let p = 0; p < prof.length; p++)
    for (let i = 0; i <= xs; i++) pos.push(-W / 2 + W * i / xs, prof[p][1], prof[p][0]);
  for (let p = 0; p < prof.length - 1; p++)
    for (let i = 0; i < xs; i++) {
      const a = p * (xs + 1) + i, b = a + 1, c = a + xs + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, coveMat);
  m.receiveShadow = true;
  return m;
}

const rig = { boxes: [] };
function sph(dist, azDeg, elDeg, y0) {
  const az = THREE.MathUtils.degToRad(azDeg), el = THREE.MathUtils.degToRad(elDeg);
  return new THREE.Vector3(Math.sin(az) * Math.cos(el) * dist, y0 + Math.sin(el) * dist, Math.cos(az) * Math.cos(el) * dist);
}

/*
  Real area-light shadows: each softbox is a rectangle. Every accumulation frame the light is
  moved to a different point on that rectangle and the frames are averaged, so shadows get a true
  penumbra — sharp where an object touches the surface, widening and blurring with distance —
  exactly like a softbox in a photo studio.
*/
function makeSoftbox({ color, intensity, w, h, az, el, dist, mapSize, shadow = true }) {
  const { aim, R } = rig;
  const center = sph(dist, az, el, aim.y);
  const dir = aim.clone().sub(center).normalize();
  const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, dir).normalize();
  const angle = Math.atan((2.1 * R) / dist);
  const light = new THREE.SpotLight(color, intensity, 0, angle, 0.65, 0);
  light.castShadow = shadow;
  light.shadow.mapSize.set(mapSize, mapSize);
  // offset scaled to the size of one shadow-map texel, so walls never shade themselves in a jagged pattern
  const texel = (2 * dist * Math.tan(angle)) / mapSize;
  light.shadow.bias = -0.0005;
  light.shadow.normalBias = texel * 1.5;
  light.shadow.radius = 5;
  light.shadow.camera.near = Math.max(0.1, dist - 2.5 * R);
  light.shadow.camera.far = dist + 3 * R;
  const target = new THREE.Object3D(); target.position.copy(aim);
  light.target = target;
  light.position.copy(center);
  studio.add(light, target);
  const box = { light, center, right, up, w, h };
  rig.boxes.push(box);
  return box;
}

function buildLights(R, centerY) {
  rig.aim = new THREE.Vector3(0, centerY, 0);
  rig.R = R;
  const D = 3.2 * R;
  // 1. KEY – large softbox, 45° to the camera's right and 45° up, in front of the model
  rig.key = makeSoftbox({ color: 0xfff2e2, intensity: 1.5, w: 1.4 * R, h: 1.4 * R, az: 45, el: 45, dist: D, mapSize: 4096 });
  // 2. FILL – wider softbox on the opposite side, 35 % of the key
  rig.fill = makeSoftbox({ color: 0xeef3ff, intensity: 1.5 * 0.35, w: 2.4 * R, h: 1.6 * R, az: -60, el: 22, dist: D * 1.15, mapSize: 1024, shadow: false });   // too weak to show its own shadows
  // 3. RIM – strip softbox behind and above, angled down toward the camera, for the edge light on rooflines
  rig.rim = makeSoftbox({ color: 0xffffff, intensity: 1.2, w: 2.2 * R, h: 0.35 * R, az: 180, el: 38, dist: D, mapSize: 1024, shadow: false });   // edge light only
  // light bouncing off the white paper cove
  rig.bounce = new THREE.HemisphereLight(0xffffff, 0xd8d4cc, 0.04);
  scene.add(rig.bounce);
}

// low-discrepancy points across each softbox so the average converges quickly
function halton(i, b) { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; }
function placeSoftboxSample(n) {
  rig.boxes.forEach((b, j) => {
    const u = n === 0 ? 0.5 : halton(n + 17 * j, 2), v = n === 0 ? 0.5 : halton(n + 17 * j, 3);
    b.light.position.copy(b.center)
      // small spread: with only a few passes a full-size softbox would show stepped shadow copies
      .addScaledVector(b.right, (u - 0.5) * b.w * 0.25)
      .addScaledVector(b.up, (v - 0.5) * b.h * 0.25);
  });
}

/* ---------- maquette finishes ---------- */
const clay = {
  card: new THREE.MeshStandardMaterial({ color: 0xf6f4ef, roughness: 0.82, metalness: 0, side: THREE.DoubleSide }),
  grey: new THREE.MeshStandardMaterial({ color: 0xbdbab3, roughness: 0.7, metalness: 0 }),
  balsa: new THREE.MeshStandardMaterial({ color: 0xd9bf94, roughness: 0.75, metalness: 0 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xd4d3cf, roughness: 0.38, metalness: 0.35 }),
  acrylic: new THREE.MeshStandardMaterial({ color: 0xdfe9ec, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.28, depthWrite: false }),
};
function clayFor(mat) {
  const n = (mat.name || '').toLowerCase();
  if (n.includes('glass') || n.includes('acrylic')) return clay.acrylic;
  if (n.includes('walnut') || n.includes('wood')) return clay.balsa;
  if (n.includes('chrome') || n.includes('silver') || n.includes('iron') || n.includes('seamed')) return clay.metal;
  if (n.includes('black') || n.includes('gray') || n.includes('grey') || n === 'default material') return clay.grey;
  return clay.card;
}

const meshes = [];
let mode = 'clay';
function setMode(m) {
  mode = m;
  for (const o of meshes) {
    o.material = m === 'clay' ? o.userData.clay : o.userData.orig;
    o.castShadow = !o.userData.noShadow && !o.material.transparent;
  }
}

const WARM = new THREE.Color(0xffb46b);   // ~2900 K tungsten

/* ---------- loading ---------- */
const fill = document.getElementById('fill'), statusEl = document.getElementById('status');
async function fetchModel() {
  const res = await (window.__modelReq || fetch(MODEL_URL));
  if (!res.ok) throw new Error('The model file could not be downloaded (' + res.status + ').');
  const total = +res.headers.get('content-length') || 4023546;
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    fill.style.width = Math.min(100, got / total * 100) + '%';
    statusEl.textContent = `Downloading model · ${(got / 1048576).toFixed(1)} MB`;
  }
  let blob = new Blob(chunks);
  const head = new Uint8Array(await blob.slice(0, 4).arrayBuffer());
  if (head[0] === 0x1f && head[1] === 0x8b) {        // gzip – unpack in the browser
    statusEl.textContent = 'Unpacking model';
    blob = await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
  }
  return blob.arrayBuffer();
}

/* ---------- guided tour: glide between outside views, fade in and out of interiors ---------- */
let current = 0, tween = null, busy = false;
const fadeEl = document.getElementById('fade');
const progressEl = document.getElementById('progress');
TOUR.forEach(() => progressEl.appendChild(document.createElement('i')));
function showStopText(i) {
  document.getElementById('step').textContent = `${String(i + 1).padStart(2, '0')} / ${String(TOUR.length).padStart(2, '0')}`;
  document.getElementById('stop-title').textContent = TOUR[i].title;
  document.getElementById('stop-text').textContent = TOUR[i].text;
  [...progressEl.children].forEach((el, j) => el.classList.toggle('on', j <= i));
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').textContent = i === TOUR.length - 1 ? 'Start again' : 'Next →';
}
function placeCamera(stop) {
  camera.position.set(...stop.pos);
  controls.target.set(...stop.target);
  camera.fov = stop.fov || DEFAULT_FOV; camera.updateProjectionMatrix();
  controls.update();
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function goStop(i, instant) {
  if (busy) return;
  const from = TOUR[current], to = TOUR[i];
  current = i; showStopText(i);
  if (instant) { placeCamera(to); return; }
  if (from.interior || to.interior) {
    // never glide through walls: fade to the backdrop, cut, fade back
    busy = true;
    fadeEl.classList.add('on'); await wait(reduceMotion ? 0 : 380);
    tween = null; placeCamera(to);
    await wait(120); fadeEl.classList.remove('on'); busy = false;
    return;
  }
  tween = {
    p0: camera.position.clone(), p1: new THREE.Vector3(...to.pos),
    t0: controls.target.clone(), t1: new THREE.Vector3(...to.target),
    f0: camera.fov, f1: to.fov || DEFAULT_FOV, start: performance.now(), dur: reduceMotion ? 1 : 1800,
  };
}
const next = () => goStop((current + 1) % TOUR.length);
const prev = () => current > 0 && goStop(current - 1);
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
});

async function swapTrees(model) {
  const spots = [];
  model.traverse(o => {
    // the loader turns spaces into underscores: 'Wire Tree 1' arrives as 'Wire_Tree_1'
    if (WIRE.test(o.name) && !WIRE.test(o.parent?.name || '')) spots.push(o);
  });
  if (!spots.length) return;
  const sBuf = Uint8Array.from(atob(STICK_TREES), c => c.charCodeAt(0)).buffer;
  const sticks = [...(await new GLTFLoader().parseAsync(sBuf, '')).scene.children];
  // the trees take the white of the model's car and people (Material4)
  let figure = null;
  model.traverse(o => { if (!figure && o.isMesh && o.material?.name === 'Material4') figure = o.material; });
  // the trees carry no texture mapping of their own: give them one so the textured finish sits right
  function addUV(g) {
    if (g.attributes.uv) return;
    const p = g.attributes.position, uv = new Float32Array(p.count * 2);
    for (let k = 0; k < p.count; k++) { uv[2 * k] = (p.getX(k) + p.getZ(k)) * 0.5; uv[2 * k + 1] = p.getY(k) * 0.5; }
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  }
  if (figure) sticks.forEach(st => st.traverse(o => { if (o.isMesh) { addUV(o.geometry); o.material = figure; } }));
  model.updateMatrixWorld(true);
  spots.forEach((spot, i) => {
    const box = new THREE.Box3().setFromObject(spot), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    spot.visible = false;
    const src = sticks[i % sticks.length];                 // cycle the three variants
    const srcH = new THREE.Box3().setFromObject(src).getSize(new THREE.Vector3()).y;
    const t = src.clone(true);
    t.scale.setScalar(size.y / srcH);
    t.position.set(c.x, box.min.y, c.z);
    t.rotation.y = i * 2.399;                       // each tree turned differently
    scene.add(t);
    t.traverse(o => {
      if (!o.isMesh) return;
      o.userData.orig = o.material; o.userData.clay = clayFor(o.material);
      o.receiveShadow = true; meshes.push(o);

    for (; p; p = p.parent) if (p.visible === false) { hidden = true; break; }

async function init() {

    const buf = await fetchModel();

    const model = gltf.scene;

    // the file is already centred on the building with the ground at y = 0, matching the tour coordinates
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    scene.add(model);
    model.traverse(o => {
      if (!o.isMesh) return;
      o.material.side = THREE.DoubleSide;
      o.userData.orig = o.material;
      o.userData.clay = clayFor(o.material);
      o.receiveShadow = true;
      meshes.push(o);

    await swapTrees(model);
    setMode('tex');

    const R = size.length() / 2;
    const centerY = size.y / 2;
    const cove = buildCove(R);

    studio.position.y = box.min.y - 0.01;   // the paper backdrop sits just under the site plinth
    buildLights(R, centerY);

    document.getElementById('tour').hidden = false;

    statusEl.textContent = e.message || 'The model could not be opened.';

}

  glassHidden.forEach(o => (o.visible = true));
  const u = bevel.uniforms;
  u.uNear.value = camera.near; u.uFar.value = camera.far;
  u.uPxPerM.value = normalRT.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  // key light direction in view space (the normal buffer is view-space)
  if (rig.key) {
    rig.key.light.getWorldPosition(keyView);
    keyView.sub(rig.key.light.target.getWorldPosition(new THREE.Vector3())).normalize().transformDirection(camera.matrixWorldInverse);
    u.uKey.value.copy(keyView);
  }
}

function sizeAll() {
  const w = innerWidth, h = innerHeight, pr = Math.min(devicePixelRatio, 1.5);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setPixelRatio(pr); composer.setSize(w, h);
  accum.forEach(t => t.setSize(Math.floor(w * pr), Math.floor(h * pr)));
  normalRT.setSize(Math.floor(w * pr), Math.floor(h * pr));
  bevel.uniforms.uTexel.value.set(1 / Math.floor(w * pr), 1 / Math.floor(h * pr));
  sampleN = 0;
}
sizeAll();
addEventListener('resize', sizeAll);

const tmp = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  if (tween) {
    const k = Math.min(1, (now - tween.start) / tween.dur);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    camera.fov = THREE.MathUtils.lerp(tween.f0, tween.f1, e); camera.updateProjectionMatrix();
    if (k >= 1) tween = null;
  }
  controls.update();
  // the photo studio turns with the camera: backdrop always behind, key always front-right, rim always behind
  tmp.copy(camera.position).sub(controls.target);
  studio.rotation.y = Math.atan2(tmp.x, tmp.z);
  camera.updateMatrixWorld();

  if (!lastCam.equals(camera.matrixWorld)) { lastCam.copy(camera.matrixWorld); sampleN = 0; }
  if (!rig.boxes.length || sampleN >= MAX_SAMPLES) return;   // converged: the canvas keeps the finished frame

  // move every softbox to its next sample point and nudge the lens by a sub-pixel for anti-aliasing
  placeSoftboxSample(sampleN);
  const W = accum[0].width, H = accum[0].height;
  if (sampleN > 0) camera.setViewOffset(W, H, halton(sampleN, 2) - 0.5, halton(sampleN, 3) - 0.5, W, H);
  composer.render();
  camera.clearViewOffset();

  const src = accum[cur], dst = accum[1 - cur];
  blendMat.uniforms.tNew.value = composer.readBuffer.texture;
  blendMat.uniforms.tOld.value = src.texture;
  blendMat.uniforms.w.value = 1 / (sampleN + 1);
  renderer.setRenderTarget(dst); renderer.render(quadScene, quadCam); renderer.setRenderTarget(null);
  cur = 1 - cur; sampleN++;
  output.render(renderer, null, { texture: dst.texture });
}
requestAnimationFrame(frame);
init();
</script>
